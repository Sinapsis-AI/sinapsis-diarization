services:
  sinapsis-diarization-main: &default
    image: sinapsis-diarization:base
    build:
      context: ../
      dockerfile: docker/Dockerfile
      ssh:
        - default
    shm_size: '8gb'
    environment:
      PYTHONUNBUFFERED: 1
      GRADIO_SHARE_APP: ${GRADIO_SHARE_APP:-false}
      PYTHONPATH: /lib/python3.10/:/app/.venv/lib/python3.10/site-packages
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - "~/.cache/sinapsis/:/root/.cache/sinapsis"
    network_mode: "host"
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
